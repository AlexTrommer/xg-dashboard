<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xG Dashboard — Watch List</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="index.html" class="logo-title">x<span>G</span></a>
    <div class="logo-sub">Dashboard</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Analysis</div>
    <a href="index.html"     class="nav-item"><span class="nav-icon">⬡</span><span>Teams</span></a>
    <a href="players.html"   class="nav-item"><span class="nav-icon">◈</span><span>Players</span></a>
    <a href="matches.html"   class="nav-item"><span class="nav-icon">◎</span><span>Matches</span></a>
    <a href="shotmap.html"   class="nav-item"><span class="nav-icon">◉</span><span>Shot Map</span></a>
    <div class="nav-section">Scouting</div>
    <a href="watchlist.html" class="nav-item"><span class="nav-icon">★</span><span>Watch List</span><span class="nav-badge">NEW</span></a>
    <div class="nav-section">Info</div>
    <a href="about.html"     class="nav-item"><span class="nav-icon">◇</span><span>About</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="status-dot"></div>
    <div class="status-text">
      <div id="lastUpdated" style="font-size:9px">Loading…</div>
      <div style="font-size:9px;color:var(--muted2)">Last refresh</div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">Watch List</span>
    <div class="topbar-filters">
      <span class="filter-label">League</span>
      <select id="fLeague" autocomplete="off" onchange="onFilterChange()"><option value="">All Leagues</option></select>
      <span class="filter-label">Season</span>
      <select id="fSeason" autocomplete="off" onchange="onFilterChange()"><option value="">All Seasons</option></select>
      <span class="filter-label">Team</span>
      <select id="fTeam" autocomplete="off" onchange="onFilterChange()"><option value="">All Teams</option></select>
      <button class="refresh-btn" onclick="triggerRefresh()">↻</button>
    </div>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Form Guide</div>
        <div class="page-title">Players to Watch</div>
        <div class="page-meta">Last 5 games · Min. 3 appearances · Ranked by npxG/90 + shot quality (no outcome dependency)</div>
      </div>
    </div>

    <div id="watchAsOf" class="watch-as-of"></div>
    <div id="watchGrid" class="watch-grid">
      <div class="loading"><div class="spinner"></div>Loading…</div>
    </div>
  </div>
</div>
</div>

<script src="shared.js"></script>
<script>
async function onFilterChange() {
  _playerCache = [];
  await loadTeamFilter();
  loadWatchlist();
}

async function loadWatchlist() {
  const {league} = getFilters();
  const grid = document.getElementById('watchGrid');
  const asOf = document.getElementById('watchAsOf');
  grid.innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;

  let url = '/api/watchlist/form?limit=50';
  if (league) url += `&league=${encodeURIComponent(league)}`;

  const players = await get(url);
  if (!players.length) {
    grid.innerHTML = '<div class="empty">No data — need ≥3 games and ≥3 shots in the last 5 games</div>';
    return;
  }

  asOf.textContent = players[0]?.season
    ? `${players[0].season}/${parseInt(players[0].season)+1} season · last 5 games per player · ${players.length} qualifiers`
    : '';

  const tierColor = r => r>=80?'#f5c842': r>=60?'#b5f542': r>=40?'#00d4ff':'#4a6070';
  const circumference = 2 * Math.PI * 22;

  grid.innerHTML = players.map((p,i) => {
    const rating     = +p.rating || 0;
    const prevRating = +p.prev_rating || 0;
    const delta      = +p.rating_delta || 0;
    const color      = tierColor(rating);
    const stroke     = circumference - (rating/100)*circumference;
    const npxgp90    = (+p.np_xg_p90||0).toFixed(3);
    const xgps       = (+p.xg_per_shot||0).toFixed(3);

    let deltaHtml = '';
    if (p.prev_rating && p.prev_rating !== 0) {
      const isUp   = delta >= 0;
      const dColor = isUp ? 'var(--accent)' : 'var(--red)';
      const arrow  = isUp ? '▲' : '▼';
      const prevNp = (+p.prev_np_xg_p90||0).toFixed(3);
      const prevQl = (+p.prev_xg_per_shot||0).toFixed(3);
      deltaHtml = `
        <div class="watch-delta delta-tooltip">
          <span class="delta-arrow" style="color:${dColor}">${arrow}</span>
          <span class="delta-text" style="color:${dColor}">${Math.abs(delta).toFixed(1)} pts</span>
          <span style="color:var(--muted);font-size:10px;margin-left:4px">vs prior 5 games</span>
          <div class="dt-content">
            <div style="color:var(--accent);font-weight:600;margin-bottom:6px">Prior 5 games</div>
            <div style="color:var(--muted)">npxG/90: <strong style="color:var(--text)">${prevNp}</strong></div>
            <div style="color:var(--muted)">xG/shot: <strong style="color:var(--text)">${prevQl}</strong></div>
            <div style="color:var(--muted)">Goals: <strong style="color:var(--text)">${p.prev_goals}</strong> in ${p.prev_games} games</div>
            <div style="margin-top:4px">Rating: <strong style="color:${dColor}">${prevRating.toFixed(1)}</strong></div>
          </div>
        </div>`;
    } else {
      deltaHtml = `<div class="watch-delta"><span style="color:var(--muted);font-size:10px">New entry this window</span></div>`;
    }

    return `
    <div class="watch-card" onclick="drillPlayer('${esc(p.player)}')">
      <div class="watch-card-rank">#${i+1}</div>
      <div class="watch-card-top">
        <div class="watch-rating-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="22" fill="none" stroke="var(--surface3)" stroke-width="4"/>
            <circle cx="26" cy="26" r="22" fill="none" stroke="${color}" stroke-width="4"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${stroke}"
              stroke-linecap="round"
              style="transform:rotate(-90deg);transform-origin:26px 26px"/>
          </svg>
          <div class="watch-rating-num" style="color:${color}">${rating.toFixed(0)}</div>
        </div>
        <div>
          <div class="watch-player-name">${p.player}</div>
          <div class="watch-player-meta">
            ${p.team}<br>
            <span class="league-badge">${shortLeague(p.league)}</span>
            &nbsp;·&nbsp; ${p.games} games
          </div>
        </div>
      </div>
      <div class="watch-stats">
        <div class="watch-stat"><div class="ws-label">npxG/90</div><div class="ws-val" style="font-size:14px">${npxgp90}</div></div>
        <div class="watch-stat"><div class="ws-label">xG/Shot</div><div class="ws-val" style="font-size:14px">${xgps}</div></div>
        <div class="watch-stat"><div class="ws-label">Goals</div><div class="ws-val">${p.goals}</div></div>
        <div class="watch-stat"><div class="ws-label">Shots</div><div class="ws-val">${p.shots}</div></div>
      </div>
      ${deltaHtml}
    </div>`;
  }).join('');
}

function drillPlayer(player) {
  sessionStorage.setItem('xg_drill_player', player);
  location.href = 'shotmap.html';
}

(async () => {
  await sharedInit();
  loadWatchlist();
})();
</script>
</body>
</html>
